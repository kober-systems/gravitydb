[package]
name = "gravitydb"
version = "0.4.0"
description = "A graph database"
authors = ["Benjamin Kober <benko@kober-systems.com>"]
homepage = "https://github.com/kober-systems/gravitydb"
edition = "2021"
license = "MIT"
keywords = [
    "database",
    "embedded-database",
    "graph",
]
categories = ["database-implementations"]

[dependencies]
gravitydb_derive = { version = "0.4", optional = true, path = "../gravitydb_derive" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
typetag = "0.2"

sha2 = "0.11.0"
uuid = { workspace = true, features = ["serde", "v4"] }
thiserror = { workspace = true }
mlua = { workspace = true, features = ["luau", "serialize", "macros"], optional = true }
rustyline = { version = "19", features = ["derive"], optional = true }

quick-xml = { version = "0.42", features = ["serialize"] }

[features]
lua = ["mlua", "rustyline" ]
js = [ "uuid/js"]
derive = ["gravitydb_derive" ]

[dev-dependencies]
pretty_assertions = { workspace = true }
gravitydb-test-utils = { path = "../gravitydb-test-utils" }
gravitydb_derive = { path = "../gravitydb_derive" }
