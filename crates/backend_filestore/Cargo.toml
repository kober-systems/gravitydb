[package]
name = "gravitydb-filestore"
version = "0.4.0"
description = "A filestore backend for the gravity database"
authors = ["Benjamin Kober <benko@kober-systems.com>"]
repository = "https://github.com/kober-systems/gravitydb"
edition = "2021"
license = "MIT"

[dependencies]
gravitydb = { version = "0.4.0", path = "../gravitydb", features = ["lua"] }
thiserror = { workspace = true }
vfs = "0.13.0"
uuid = { workspace = true, features = ["serde", "v4"] }
# maybe we use a more compact serialisation format later for production
serde_json = { workspace = true }

mlua = { workspace = true, features = ["luau", "serialize", "anyhow"] }
clap = { version = "4", features = ["derive"] }
log = "0.4.8"
simple_logger = "5.0.0"
anyhow = "1.0"

[dev-dependencies]
pretty_assertions = { workspace = true }
gravitydb-test-utils = { path = "../gravitydb-test-utils" }
