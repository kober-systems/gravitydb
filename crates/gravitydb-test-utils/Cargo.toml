[package]
name = "gravitydb-test-utils"
description = "shared test utils for gravitydb backends"
version = "0.1.1"
repository = "https://github.com/kober-systems/gravitydb"
license = "MIT"
edition = "2024"

[dependencies]
gravitydb = { version = "0.4.0", path = "../gravitydb" }
serde = { workspace = true, features = ["derive"] }
pretty_assertions = { workspace = true }

